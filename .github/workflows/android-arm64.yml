name: Android ARM64 build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out StarlightGaiden
        uses: actions/checkout@v4
      - name: Check out audited upstream source
        uses: actions/checkout@v4
        with:
          repository: sergiomanzur/regaiden-recomp
          ref: e5befd20e67939d939319149d1c1177b8e6c5cd6
          path: regaiden-recomp
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install pinned NDK
        run: sdkmanager "ndk;26.2.11394342" "cmake;3.22.1"
      - name: Apply guarded RGM integration
        run: python integration/regaiden-recomp/apply_rgm_adapter.py regaiden-recomp
      - name: Configure Android ARM64
        run: |
          cmake -S regaiden-recomp -B regaiden-recomp/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -G Ninja
      - name: Build Android ARM64
        run: cmake --build regaiden-recomp/build-android --parallel 2
