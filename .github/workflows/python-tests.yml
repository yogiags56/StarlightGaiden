name: Python analysis tools

on:
  push:
    branches: ["main", "work/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile analysis tools
        run: python -m py_compile tools/rgm_snapshot_analyzer.py tools/rgm_graphics_comparator.py tools/rgm_room_fingerprint.py tools/rgm_capture_validator.py tools/rgm_scene_correlator.py tools/rgm_scene_classifier.py
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
